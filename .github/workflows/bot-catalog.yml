# Catalog bots: check every bot and build the signed catalog when bots are pushed (docs/bot-framework_en.md).
# The output is kept as an artifact; how it reaches production is decided by the release environment.
# Until the repository has AMB_CATALOG_PRIVATE_KEY, this only checks and doesn't pack.
# Static checks only: the rendering and real-model checks (check --full) are optional and never run here.
name: Bot catalog

on:
  push:
    branches: [master]
    paths: ["bots/**", "catalog.json", "src/botkit/**", "assets/bot-template/**"]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check every bot
        run: |
          shopt -s nullglob
          for d in bots/*/; do npm run --silent bot -- check "$d"; done
      - name: Pack and sign
        id: pack
        env:
          AMB_CATALOG_PRIVATE_KEY: ${{ secrets.AMB_CATALOG_PRIVATE_KEY }}
        run: |
          if [ -z "$AMB_CATALOG_PRIVATE_KEY" ]; then
            echo "AMB_CATALOG_PRIVATE_KEY isn't set; skipping pack."
            exit 0
          fi
          npm run --silent bot -- pack --root . --out dist-catalog
          echo "packed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.pack.outputs.packed == 'true'
        with:
          name: bot-catalog
          path: dist-catalog
